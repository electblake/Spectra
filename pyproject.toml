[project]
name = "spectra"
version = "0.4.5"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=5.0.0.93",
    "pillow>=10.0.0",
    "platformdirs>=4.11.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]

[project.scripts]
spectra = "app.main:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.tabs"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
