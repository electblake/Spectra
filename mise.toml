[tools]
powershell = "7"
python = "3.12"
uv = "latest"

[tasks.build]
description = "Compile Spectra as a standalone executable"
run = "uv run --isolated pyinstaller --noconfirm --clean Spectra.spec"
env = { PYTHONPATH = "" }

[tasks.run]
description = "Run Spectra from source"
run = "uv run python -m app"
env = { PYTHONPATH = "" }
